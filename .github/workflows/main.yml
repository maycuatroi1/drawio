name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12', '3.14']
        os: [ubuntu-latest, windows-latest, macos-latest]
        # setup-python has no 3.9 build for the newest Ubuntu image.
        exclude:
          - python-version: '3.9'
            os: ubuntu-latest
        include:
          - python-version: '3.9'
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m ruff check drawio tests examples setup.py
      - run: python -m ruff format --check drawio tests examples setup.py
      - run: python -m pytest --cov=drawio --cov-report=xml
      - run: python -m build
