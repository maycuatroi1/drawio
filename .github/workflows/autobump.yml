name: Auto Bump Version

on:
  push:
    branches:
      - main

# One bump at a time, so two quick merges do not both bump from the same VERSION
concurrency:
  group: autobump
  cancel-in-progress: false

jobs:
  bump-version:
    if: github.actor != 'github-actions'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The newest main, not the pushed commit: a bump that ran meanwhile is already on it
          ref: main
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Bump patch version
        id: bump
        run: |
          version=$(cat drawio/VERSION)
          echo "Current version: $version"
          IFS='.' read -r major minor patch <<< "$version"
          patch=$((patch+1))
          new_version="$major.$minor.$patch"
          echo "$new_version" > drawio/VERSION
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git add drawio/VERSION
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          git tag ${{ steps.bump.outputs.new_version }}
          git push origin HEAD
          git push origin ${{ steps.bump.outputs.new_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The tag above is pushed with GITHUB_TOKEN, which starts no workflow, so release.yml is called here.
  release:
    needs: bump-version
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump-version.outputs.version }}
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
